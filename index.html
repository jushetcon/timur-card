<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тимур</title>
<style>
  :root {
    --bg: #0d0f12;
    --text: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #00e0a4;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  .greeting {
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 600;
    margin: 0 0 20px;
    color: var(--muted);
  }

  h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  .role {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .links a {
    display: block;
    padding: 14px 20px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--accent);
    background: rgba(0, 224, 164, 0.08);
    transform: translateY(-2px);
  }

  .links a span {
    color: var(--accent);
    margin-right: 8px;
  }

  .pulse-btn {
    display: block;
    width: 100%;
    margin: 24px 0 0;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #08110d;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .pulse-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .pulse-count {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
    min-height: 1.2em;
  }
</style>
</head>
<body>
  <div class="card">
    <p class="greeting" id="greeting">Привет!</p>
    <h1>Тимур</h1>
    <p class="role">вайбкодер</p>
    <div class="links">
      <a href="https://telegram.org" target="_blank" rel="noopener"><span>✈</span>Telegram</a>
      <a href="#"><span>✉</span>Почта</a>
      <a href="#" target="_blank" rel="noopener"><span>◆</span>Соцсеть</a>
    </div>

    <button type="button" class="pulse-btn" id="pulseBtn">✨ Нажми меня</button>
    <p class="pulse-count" id="pulseCount"></p>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;

      if (tg) {
        try { tg.ready(); } catch (e) {}
        try { tg.expand(); } catch (e) {}

        var bg = '#0d0f12';

        try {
          if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
            tg.setHeaderColor(bg);
            tg.setBackgroundColor(bg);
          } else if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
            tg.setHeaderColor('bg_color');
            tg.setBackgroundColor('bg_color');
          }
        } catch (e) {}

        try {
          if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
          } else if (tg.enableClosingConfirmation) {
            tg.enableClosingConfirmation();
          }
        } catch (e) {}

        try {
          var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
          var greetingEl = document.getElementById('greeting');
          if (user && user.first_name && greetingEl) {
            greetingEl.textContent = 'Привет, ' + user.first_name + '!';
          }
        } catch (e) {}
      }

      var pulseBtn = document.getElementById('pulseBtn');
      var pulseCount = document.getElementById('pulseCount');
      var count = 0;

      if (pulseBtn) {
        pulseBtn.addEventListener('click', function () {
          count += 1;
          if (pulseCount) {
            pulseCount.textContent = 'Нажатий: ' + count;
          }

          try {
            if (tg && tg.HapticFeedback && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
              tg.HapticFeedback.impactOccurred('medium');
            } else if (navigator.vibrate) {
              navigator.vibrate(50);
            }
          } catch (e) {}
        });
      }
    })();
  </script>
</body>
</html>
