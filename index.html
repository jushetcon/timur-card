<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тимур</title>
<style>
  :root {
    --bg: #0d0f12;
    --text: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #00e0a4;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    text-align: center;
    max-width: 420px;
    width: 100%;
  }

  h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  .role {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .links a {
    display: block;
    padding: 14px 20px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--accent);
    background: rgba(0, 224, 164, 0.08);
    transform: translateY(-2px);
  }

  .links a span {
    color: var(--accent);
    margin-right: 8px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Тимур</h1>
    <p class="role">вайбкодер</p>
    <div class="links">
      <a href="#" target="_blank" rel="noopener"><span>✈</span>Telegram</a>
      <a href="#"><span>✉</span>Почта</a>
      <a href="#" target="_blank" rel="noopener"><span>◆</span>Соцсеть</a>
    </div>
  </div>
</body>
</html>
