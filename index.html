<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Привычки</title>
<style>
  :root {
    --bg: #0d0f12;
    --text: #f2f2f2;
    --muted: #9aa0a6;
    --accent: #00e0a4;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100%;
  }

  .screen {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px;
  }

  .screen[hidden] {
    display: none;
  }

  .card {
    text-align: center;
    max-width: 420px;
    width: 100%;
    margin: auto;
  }

  .greeting {
    font-size: clamp(1.4rem, 6vw, 2rem);
    font-weight: 600;
    margin: 0 0 20px;
    color: var(--muted);
  }

  h1 {
    font-size: clamp(2.5rem, 10vw, 4rem);
    font-weight: 700;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }

  .habits-card h1 {
    font-size: clamp(1.8rem, 8vw, 2.6rem);
    margin: 0 0 24px;
  }

  .role {
    color: var(--accent);
    font-size: 1.1rem;
    font-weight: 500;
    margin: 0 0 40px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .links a {
    display: block;
    padding: 14px 20px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
    color: var(--text);
    text-decoration: none;
    font-size: 1rem;
    font-weight: 500;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease;
  }

  .links a:hover,
  .links a:focus-visible {
    border-color: var(--accent);
    background: rgba(0, 224, 164, 0.08);
    transform: translateY(-2px);
  }

  .links a span {
    color: var(--accent);
    margin-right: 8px;
  }

  .pulse-btn {
    display: block;
    width: 100%;
    margin: 24px 0 0;
    padding: 14px 20px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #08110d;
    font-size: 1rem;
    font-weight: 700;
    font-family: inherit;
    cursor: pointer;
    transition: transform 0.15s ease, opacity 0.15s ease;
  }

  .pulse-btn:active {
    transform: scale(0.97);
    opacity: 0.9;
  }

  .pulse-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .buy-btn {
    background: #f5a623;
    color: #2b1a00;
  }

  .pulse-count {
    margin: 12px 0 0;
    color: var(--muted);
    font-size: 0.95rem;
    min-height: 1.2em;
  }

  .tabbar {
    display: flex;
    flex-shrink: 0;
    border-top: 1px solid #2a2d33;
    background: var(--bg);
    padding-bottom: env(safe-area-inset-bottom);
  }

  .tab {
    flex: 1;
    min-height: 44px;
    padding: 10px 8px;
    border: none;
    background: none;
    color: var(--muted);
    font-family: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
  }

  .tab.active {
    color: var(--accent);
  }

  .today-habits {
    margin-top: 32px;
    text-align: left;
  }

  .progress-line {
    text-align: center;
    color: var(--muted);
    font-size: 0.95rem;
    font-weight: 600;
    margin: 0 0 16px;
  }

  .habit-form {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }

  .habit-input {
    flex: 1;
    min-height: 44px;
    padding: 0 14px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
    background: transparent;
    color: var(--text);
    font-family: inherit;
    font-size: 1rem;
  }

  .habit-input::placeholder {
    color: var(--muted);
  }

  .habit-input:focus,
  .habit-input:focus-visible {
    outline: none;
    border-color: var(--accent);
  }

  .habit-add-btn {
    min-height: 44px;
    min-width: 44px;
    padding: 0 18px;
    border: none;
    border-radius: 12px;
    background: var(--accent);
    color: #08110d;
    font-family: inherit;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }

  .habit-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .habit-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 10px;
    border: 1px solid #2a2d33;
    border-radius: 12px;
  }

  .habit-row-name {
    flex: 1;
    font-size: 1rem;
    word-break: break-word;
  }

  .habit-row-name.done {
    color: var(--muted);
    text-decoration: line-through;
  }

  .habit-delete {
    flex-shrink: 0;
    min-width: 44px;
    min-height: 44px;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 1.1rem;
    cursor: pointer;
  }

  .habit-delete:hover,
  .habit-delete:focus-visible {
    color: #ff6b6b;
  }

  .habit-toggle {
    flex-shrink: 0;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 2px solid #2a2d33;
    background: none;
    color: transparent;
    font-size: 1.1rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  .habit-toggle.done {
    background: var(--accent);
    border-color: var(--accent);
    color: #08110d;
  }

  .habit-streak {
    flex-shrink: 0;
    color: var(--accent);
    font-size: 0.85rem;
    font-weight: 600;
    white-space: nowrap;
  }

  .empty-note {
    color: var(--muted);
    font-size: 0.95rem;
    text-align: center;
    margin: 0;
  }

  .sync-notice {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: 50%;
    transform: translateX(-50%);
    max-width: calc(100% - 32px);
    background: #2a2d33;
    color: var(--text);
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 0.85rem;
    text-align: center;
    box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
    z-index: 10;
  }

  .sync-notice[hidden] {
    display: none;
  }
</style>
</head>
<body>
  <p class="sync-notice" id="syncNotice" hidden></p>

  <div class="app">
    <main class="screen" id="screen-today">
      <div class="card">
        <p class="greeting" id="greeting">Привет!</p>

        <div class="today-habits">
          <p class="progress-line" id="progressLine" hidden></p>
          <ul class="habit-list" id="todayList"></ul>
          <p class="empty-note" id="todayEmpty" hidden>Заведи привычки на соседнем экране</p>
        </div>
      </div>
    </main>

    <main class="screen" id="screen-habits" hidden>
      <div class="card habits-card">
        <h1>Привычки</h1>

        <form class="habit-form" id="habitForm">
          <input type="text" id="habitInput" class="habit-input" placeholder="Название привычки" autocomplete="off">
          <button type="submit" class="habit-add-btn">Добавить</button>
        </form>

        <ul class="habit-list" id="habitsList"></ul>
        <p class="empty-note" id="habitsEmpty" hidden>Пока пусто. Добавь первую привычку</p>
      </div>
    </main>

    <main class="screen" id="screen-contacts" hidden>
      <div class="card">
        <h1>Тимур</h1>
        <p class="role">вайбкодер</p>
        <div class="links">
          <a href="https://telegram.org" target="_blank" rel="noopener"><span>✈</span>Telegram</a>
          <a href="#"><span>✉</span>Почта</a>
          <a href="#" target="_blank" rel="noopener"><span>◆</span>Соцсеть</a>
        </div>

        <button type="button" class="pulse-btn" id="pulseBtn">✨ Нажми меня</button>
        <p class="pulse-count" id="pulseCount"></p>

        <button type="button" class="pulse-btn buy-btn" id="buyBtn">⭐ Купить</button>
      </div>
    </main>

    <nav class="tabbar">
      <button type="button" class="tab active" id="tab-today" data-screen="today">Сегодня</button>
      <button type="button" class="tab" id="tab-habits" data-screen="habits">Привычки</button>
      <button type="button" class="tab" id="tab-contacts" data-screen="contacts">Контакты</button>
    </nav>
  </div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    (function () {
      var tg = window.Telegram && window.Telegram.WebApp;

      if (tg) {
        try { tg.ready(); } catch (e) {}
        try { tg.expand(); } catch (e) {}

        var bg = '#0d0f12';

        try {
          if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.9')) {
            tg.setHeaderColor(bg);
            tg.setBackgroundColor(bg);
          } else if (tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
            tg.setHeaderColor('bg_color');
            tg.setBackgroundColor('bg_color');
          }
        } catch (e) {}

        try {
          if (tg.isVersionAtLeast && tg.isVersionAtLeast('7.7') && tg.disableVerticalSwipes) {
            tg.disableVerticalSwipes();
          } else if (tg.enableClosingConfirmation) {
            tg.enableClosingConfirmation();
          }
        } catch (e) {}

        try {
          var user = tg.initDataUnsafe && tg.initDataUnsafe.user;
          var greetingEl = document.getElementById('greeting');
          if (user && user.first_name && greetingEl) {
            greetingEl.textContent = 'Привет, ' + user.first_name + '!';
          }
        } catch (e) {}
      }

      function haptic(style) {
        try {
          if (tg && tg.HapticFeedback && tg.isVersionAtLeast && tg.isVersionAtLeast('6.1')) {
            tg.HapticFeedback.impactOccurred(style || 'medium');
          } else if (navigator.vibrate) {
            navigator.vibrate(style === 'light' ? 20 : 50);
          }
        } catch (e) {}
      }

      // --- кнопка "Нажми меня" ---

      var pulseBtn = document.getElementById('pulseBtn');
      var pulseCount = document.getElementById('pulseCount');
      var count = 0;

      if (pulseBtn) {
        pulseBtn.addEventListener('click', function () {
          count += 1;
          if (pulseCount) {
            pulseCount.textContent = 'Нажатий: ' + count;
          }
          haptic('medium');
        });
      }

      // --- кнопка "Купить" (оплата звёздами Telegram) ---

      var buyBtn = document.getElementById('buyBtn');

      function markPurchased() {
        if (!buyBtn) return;
        buyBtn.disabled = true;
        buyBtn.textContent = '✓ Куплено';
      }

      if (buyBtn) {
        buyBtn.addEventListener('click', function () {
          if (buyBtn.disabled) return; // не даём выставить два счёта подряд

          if (!canSync) {
            // вне Telegram платить негде и не через что подтвердить личность — это нормально
            showSyncNotice('Оплата доступна только в Telegram');
            return;
          }

          if (typeof tg.openInvoice !== 'function') {
            showSyncNotice('Эта версия Telegram не поддерживает оплату');
            return;
          }

          buyBtn.disabled = true;
          haptic('light');

          fetch('/api/pay', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ initData: tg.initData })
          })
            .then(function (r) {
              return r.json().catch(function () { return null; }).then(function (json) {
                return { ok: r.ok, json: json };
              });
            })
            .then(function (result) {
              var json = result.json;

              if (!result.ok || !json || !json.ok || !json.link) {
                logSyncFailure('не удалось создать счёт (pay)', 'HTTP-ответ не ok', json);
                showSyncNotice((json && json.message) || 'Не получилось создать счёт, попробуй ещё раз');
                buyBtn.disabled = false;
                return;
              }

              try {
                tg.openInvoice(json.link, function (status) {
                  // status: 'paid' | 'cancelled' | 'failed' | 'pending'
                  // закрыл ли человек окно оплаты, оплатил ли — в любом случае
                  // спокойно возвращаемся и разблокируем кнопку, без ошибок
                  console.log('[pay] окно оплаты закрыто со статусом:', status);
                  buyBtn.disabled = false;

                  if (status === 'paid') {
                    // не верим окну оплаты на слово — переспрашиваем сервер,
                    // уведомление об оплате доходит до него не мгновенно
                    showSyncNotice('Оплата прошла, проверяем доступ…');
                    pollPaymentAccess(5);
                  }
                });
              } catch (e) {
                logSyncFailure('не удалось открыть окно оплаты (openInvoice)', e, null);
                showSyncNotice('Не получилось открыть окно оплаты');
                buyBtn.disabled = false;
              }
            })
            .catch(function (err) {
              logSyncFailure('не удалось создать счёт (pay) — сеть недоступна', err, null);
              showSyncNotice('Нет связи с сервером. Попробуй ещё раз');
              buyBtn.disabled = false;
            });
        });
      }

      // спрашиваем сервер, открылся ли доступ, с паузой в секунду —
      // уведомление от Telegram о платеже доходит до сервера не мгновенно
      function pollPaymentAccess(attemptsLeft) {
        if (attemptsLeft <= 0) {
          showSyncNotice('Деньги списаны, доступ вот-вот появится. Если за пару минут не появится — напиши нашему боту');
          return;
        }

        fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData, action: 'status' })
        })
          .then(function (r) {
            return r.json().catch(function () { return null; }).then(function (json) {
              return { ok: r.ok, json: json };
            });
          })
          .then(function (result) {
            var json = result.json;

            if (result.ok && json && json.ok && json.hasAccess) {
              markPurchased();
              showSyncNotice('Готово! Доступ открыт 🎉');
              return;
            }

            if (!result.ok || !json || !json.ok) {
              logSyncFailure('не удалось проверить доступ (pay status)', 'HTTP-ответ не ok', json);
            }

            setTimeout(function () { pollPaymentAccess(attemptsLeft - 1); }, 1000);
          })
          .catch(function (err) {
            logSyncFailure('не удалось проверить доступ (pay status) — сеть недоступна', err, null);
            setTimeout(function () { pollPaymentAccess(attemptsLeft - 1); }, 1000);
          });
      }

      // --- переключение экранов ---

      var tabs = document.querySelectorAll('.tab');
      var screens = {
        today: document.getElementById('screen-today'),
        habits: document.getElementById('screen-habits'),
        contacts: document.getElementById('screen-contacts')
      };

      tabs.forEach(function (tab) {
        tab.addEventListener('click', function () {
          var target = tab.getAttribute('data-screen');

          tabs.forEach(function (t) {
            t.classList.toggle('active', t === tab);
          });

          Object.keys(screens).forEach(function (key) {
            screens[key].hidden = key !== target;
          });
        });
      });

      // --- даты по местному времени устройства (не UTC) ---

      function formatDateLocal(d) {
        var y = d.getFullYear();
        var m = String(d.getMonth() + 1).padStart(2, '0');
        var day = String(d.getDate()).padStart(2, '0');
        return y + '-' + m + '-' + day;
      }

      function todayStr() {
        return formatDateLocal(new Date());
      }

      function parseDateStr(s) {
        var parts = s.split('-').map(Number);
        return new Date(parts[0], parts[1] - 1, parts[2]);
      }

      function addDaysToDateStr(s, delta) {
        var d = parseDateStr(s);
        d.setDate(d.getDate() + delta);
        return formatDateLocal(d);
      }

      // серия: сколько дней подряд, идущих без пропуска назад от последней отметки.
      // если последняя отметка старше вчерашней — серии больше нет (0), не в полночь,
      // а по факту пропуска целого дня.
      function computeStreak(dates) {
        if (!dates || dates.length === 0) return 0;

        var set = {};
        dates.forEach(function (d) { set[d] = true; });

        var last = null;
        Object.keys(set).forEach(function (d) {
          if (!last || d > last) last = d;
        });

        var today = todayStr();
        var yesterday = addDaysToDateStr(today, -1);
        if (last !== today && last !== yesterday) return 0;

        var streak = 0;
        var cursor = last;
        while (set[cursor]) {
          streak += 1;
          cursor = addDaysToDateStr(cursor, -1);
        }
        return streak;
      }

      // --- состояние привычек: единственный источник правды ---
      // хранится в localStorage одной записью под ключом STORAGE_KEY.
      // у каждой привычки — список дат выполнения (ГГГГ-ММ-ДД, по местному времени)

      var STORAGE_KEY = 'habits-app';
      var STORAGE_VERSION = 2;
      var LEGACY_VERSION_WITH_DONE_FLAG = 1;

      function loadState() {
        try {
          var raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return { habits: [] };

          var parsed = JSON.parse(raw);

          if (!parsed || typeof parsed !== 'object' || !Array.isArray(parsed.habits)) {
            return { habits: [] };
          }

          if (parsed.version === STORAGE_VERSION) {
            var habits = parsed.habits
              .filter(function (h) {
                return h && typeof h.id === 'string' && typeof h.name === 'string' && Array.isArray(h.dates);
              })
              .map(function (h) {
                return {
                  id: h.id,
                  name: h.name,
                  dates: h.dates.filter(function (d) { return typeof d === 'string'; })
                };
              });
            return { habits: habits };
          }

          if (parsed.version === LEGACY_VERSION_WITH_DONE_FLAG) {
            // старый формат: было done true/false — переносим как отметку за сегодня
            var today = todayStr();
            var migrated = parsed.habits
              .filter(function (h) {
                return h && typeof h.id === 'string' && typeof h.name === 'string' && typeof h.done === 'boolean';
              })
              .map(function (h) {
                return { id: h.id, name: h.name, dates: h.done ? [today] : [] };
              });
            return { habits: migrated };
          }

          // незнакомая версия формата — начинаем с пустого списка
          return { habits: [] };
        } catch (e) {
          // мусор в хранилище — начинаем с пустого списка
          return { habits: [] };
        }
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({
            version: STORAGE_VERSION,
            habits: state.habits
          }));
        } catch (e) {}
      }

      var state = loadState();
      var idCounter = 0;

      function addHabit(name) {
        idCounter += 1;
        state.habits.push({ id: 'habit-' + Date.now() + '-' + idCounter, name: name, dates: [] });
        renderHabits();
        scheduleSync();
      }

      function removeHabit(id) {
        state.habits = state.habits.filter(function (h) { return h.id !== id; });
        renderHabits();
        scheduleSync();
      }

      function toggleHabit(id) {
        var today = todayStr();
        state.habits = state.habits.map(function (h) {
          if (h.id !== id) return h;
          var dates = h.dates.slice();
          var idx = dates.indexOf(today);
          if (idx === -1) {
            dates.push(today);
          } else {
            dates.splice(idx, 1);
          }
          return Object.assign({}, h, { dates: dates });
        });
        renderHabits();
        scheduleSync();
      }

      function renderHabitsScreen() {
        var list = document.getElementById('habitsList');
        var empty = document.getElementById('habitsEmpty');
        list.innerHTML = '';

        empty.hidden = state.habits.length !== 0;

        state.habits.forEach(function (h) {
          var li = document.createElement('li');
          li.className = 'habit-row';

          var name = document.createElement('span');
          name.className = 'habit-row-name';
          name.textContent = h.name;

          var del = document.createElement('button');
          del.type = 'button';
          del.className = 'habit-delete';
          del.setAttribute('aria-label', 'Удалить привычку «' + h.name + '»');
          del.textContent = '✕';
          del.addEventListener('click', function () {
            haptic('light');
            removeHabit(h.id);
          });

          li.appendChild(name);
          li.appendChild(del);
          list.appendChild(li);
        });
      }

      function renderTodayScreen() {
        var list = document.getElementById('todayList');
        var empty = document.getElementById('todayEmpty');
        var progress = document.getElementById('progressLine');
        list.innerHTML = '';

        if (state.habits.length === 0) {
          empty.hidden = false;
          progress.hidden = true;
          return;
        }

        empty.hidden = true;
        progress.hidden = false;

        var today = todayStr();
        var doneCount = state.habits.filter(function (h) { return h.dates.indexOf(today) !== -1; }).length;
        progress.textContent = 'Сделано ' + doneCount + ' из ' + state.habits.length;

        state.habits.forEach(function (h) {
          var doneToday = h.dates.indexOf(today) !== -1;
          var streak = computeStreak(h.dates);

          var li = document.createElement('li');
          li.className = 'habit-row';

          var toggle = document.createElement('button');
          toggle.type = 'button';
          toggle.className = 'habit-toggle' + (doneToday ? ' done' : '');
          toggle.setAttribute('aria-pressed', doneToday ? 'true' : 'false');
          toggle.setAttribute('aria-label', h.name);
          toggle.textContent = '✓';
          toggle.addEventListener('click', function () {
            haptic('medium');
            toggleHabit(h.id);
          });

          var name = document.createElement('span');
          name.className = 'habit-row-name' + (doneToday ? ' done' : '');
          name.textContent = h.name;

          li.appendChild(toggle);
          li.appendChild(name);

          // серию нулевой длины (сброшенную) не показываем
          if (streak >= 1) {
            var streakEl = document.createElement('span');
            streakEl.className = 'habit-streak';
            streakEl.textContent = streak + ' ' + daysLabel(streak) + ' подряд';
            li.appendChild(streakEl);
          }

          list.appendChild(li);
        });
      }

      // склонение слова "день" под число (1 день, 2-4 дня, 5+ дней)
      function daysLabel(n) {
        var mod10 = n % 10;
        var mod100 = n % 100;
        if (mod10 === 1 && mod100 !== 11) return 'день';
        if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return 'дня';
        return 'дней';
      }

      function renderHabits() {
        renderHabitsScreen();
        renderTodayScreen();
        saveState();
      }

      var habitForm = document.getElementById('habitForm');
      var habitInput = document.getElementById('habitInput');

      if (habitForm) {
        habitForm.addEventListener('submit', function (e) {
          e.preventDefault();
          var value = habitInput.value.trim();
          if (!value) return;

          haptic('light');
          addHabit(value);
          habitInput.value = '';
          habitInput.focus();
        });
      }

      renderHabits();

      // --- видимые уведомления о сбоях ---
      // короткое человеческое сообщение — на экране; полная техническая
      // причина — всегда в консоли браузера (F12 → Console), чтобы её
      // можно было найти, а не только гадать, что случилось.

      var syncNoticeEl = document.getElementById('syncNotice');
      var syncNoticeTimer = null;

      function showSyncNotice(text) {
        if (!syncNoticeEl) return;
        syncNoticeEl.textContent = text;
        syncNoticeEl.hidden = false;
        if (syncNoticeTimer) clearTimeout(syncNoticeTimer);
        syncNoticeTimer = setTimeout(function () {
          syncNoticeEl.hidden = true;
        }, 4000);
      }

      function logSyncFailure(context, err, responseJson) {
        // полный текст — в консоль, для отладки
        console.error('[habits sync] ' + context, {
          error: err,
          serverCode: responseJson && responseJson.code,
          serverMessage: responseJson && responseJson.message
        });
      }

      // --- синхронизация с сервером (/api/habits → Supabase) ---
      // работает только внутри Telegram: там есть initData, которым сервер
      // проверяет личность. Вне Telegram — обычное поведение на localStorage,
      // без сетевых запросов. localStorage при этом продолжает вестись как раньше.

      var canSync = !!(tg && tg.initData);
      var syncTimer = null;
      var syncInFlight = false;
      var syncPending = false;

      function performSync() {
        if (syncInFlight) {
          syncPending = true;
          return;
        }
        syncInFlight = true;

        fetch('/api/habits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            initData: tg.initData,
            action: 'write',
            data: { version: STORAGE_VERSION, habits: state.habits }
          })
        })
          .then(function (r) {
            if (r.ok) return null;
            return r.json().catch(function () { return null; }).then(function (json) {
              logSyncFailure('не удалось сохранить (write)', 'HTTP ' + r.status, json);
              showSyncNotice('Не получилось сохранить, попробую ещё раз');
            });
          })
          .catch(function (err) {
            // сеть недоступна — приложение продолжает работать с тем, что уже есть
            logSyncFailure('не удалось сохранить (write) — сеть недоступна', err, null);
            showSyncNotice('Нет связи с сервером. Попробую сохранить позже');
          })
          .then(function () {
            syncInFlight = false;
            if (syncPending) {
              syncPending = false;
              scheduleSync();
            }
          });
      }

      // не чаще раза в секунду: собираем все изменения за эту секунду в один запрос
      function scheduleSync() {
        if (!canSync) return;
        if (syncTimer) return;
        syncTimer = setTimeout(function () {
          syncTimer = null;
          performSync();
        }, 1000);
      }

      function loadFromServer() {
        if (!canSync) return;

        fetch('/api/habits', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData, action: 'read' })
        })
          .then(function (r) {
            return r.json().catch(function () { return null; }).then(function (json) {
              return { ok: r.ok, json: json };
            });
          })
          .then(function (result) {
            var json = result.json;

            if (!result.ok || !json || !json.ok) {
              logSyncFailure('не удалось загрузить (read)', 'HTTP-ответ не ok', json);
              showSyncNotice('Не получилось загрузить последние данные. Показываю то, что есть');
              return;
            }

            var remote = json.data;

            if (!remote || !Array.isArray(remote.habits)) {
              // строки в базе ещё нет — это первый запуск для этого человека.
              // переносим то, что уже накопилось локально в localStorage
              if (state.habits.length > 0) {
                scheduleSync();
              }
              return;
            }

            state.habits = remote.habits.filter(function (h) {
              return h && typeof h.id === 'string' && typeof h.name === 'string' && Array.isArray(h.dates);
            });
            renderHabits();
          })
          .catch(function (err) {
            // сеть недоступна — показываем то, что уже загружено локально, экран не пустой
            logSyncFailure('не удалось загрузить (read) — сеть недоступна', err, null);
            showSyncNotice('Нет связи с сервером. Показываю то, что есть');
          });
      }

      loadFromServer();

      // проверяем при запуске, нет ли уже доступа — чтобы кнопка "Купить"
      // сразу показывала правильное состояние и не давала заплатить второй раз
      if (canSync) {
        fetch('/api/pay', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ initData: tg.initData, action: 'status' })
        })
          .then(function (r) {
            return r.json().catch(function () { return null; }).then(function (json) {
              return { ok: r.ok, json: json };
            });
          })
          .then(function (result) {
            var json = result.json;
            if (result.ok && json && json.ok && json.hasAccess) {
              markPurchased();
            } else if (!result.ok || !json || !json.ok) {
              logSyncFailure('не удалось проверить доступ при запуске (pay status)', 'HTTP-ответ не ok', json);
            }
          })
          .catch(function (err) {
            // сеть недоступна — оставляем кнопку как есть, пользователь может попробовать позже
            logSyncFailure('не удалось проверить доступ при запуске (pay status) — сеть недоступна', err, null);
          });
      }
    })();
  </script>
</body>
</html>
